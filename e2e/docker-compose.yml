networks:
  e2e-network:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: e2e-postgres
    networks:
      - e2e-network
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  l0-server:
    image: bigtangle-l0:dev
    container_name: e2e-l0-server
    networks:
      - e2e-network
    ports:
      - "18088:8088"
    extra_hosts:
      - "e2e-l0-server:127.0.0.1"
    environment:
      APP_MODULE: layer0-server
      SERVER_PORT: 8088
      SERVER_NET: Test
      SERVICE_SCHEDULE_MICROBATCH: "true"
      SERVICE_SCHEDULE_BLOCKBATCH: "true"
      SERVICE_SCHEDULE_BLOCKBATCHRATE: 5000
      DB_HOSTNAME: postgres
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      CREATETABLE: "true"
      SERVICE_MINING: "false"
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      SYNCBLOCKS: 1000
      POS_ENABLED: "true"
      POS_SLOT_INTERVAL_MS: 12000
      POS_SLOTS_PER_EPOCH: 32
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  l0-mcmc:
    image: bigtangle-l0:dev
    container_name: e2e-l0-mcmc
    networks:
      - e2e-network
    ports:
      - "18084:8084"
    extra_hosts:
      - "e2e-l0-mcmc:127.0.0.1"
    environment:
      APP_MODULE: layer0-mcmc
      SERVER_PORT: 8084
      SERVER_NET: Test
      REQUESTER: http://l0-server:8088
      DB_HOSTNAME: postgres
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "true"
      SERVICE_MINING_RATE: 50000
      SERVICE_MCMC: "true"
      SERVICE_MCMC_RATE: 1000
      SERVICE_INITSYNC: "false"
      SERVICE_SYNC: "true"
      SYNCBLOCKS: 1000
      CREATETABLE: "false"
      POS_ENABLED: "true"
      POS_SLOT_INTERVAL_MS: 12000
      POS_SLOTS_PER_EPOCH: 32
      POS_VALIDATOR_KEY: "4d09f2fd7a61ff8a519b15e605e29572fe32b6f3c0b6ea050aa9f70f4b92f692"
    depends_on:
      l0-server:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres-l1-order:
    image: postgres:16
    container_name: e2e-l1-order-pg
    networks:
      - e2e-network
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: ordermatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ordermatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  l1-order-server:
    image: bigtangle-l0:dev
    container_name: e2e-l1-order-server
    networks:
      - e2e-network
    ports:
      - "18086:8086"
    extra_hosts:
      - "e2e-l1-order-server:127.0.0.1"
    environment:
      APP_MODULE: l1-order-server
      SERVER_PORT: 8086
      SERVER_NET: Test
      DB_HOSTNAME: postgres-l1-order
      DB_PORT: 5432
      DB_NAME: ordermatch
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      CREATETABLE: "true"
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      SYNCBLOCKS: 1000
    depends_on:
      postgres-l1-order:
        condition: service_healthy
    restart: unless-stopped

  l1-order-mcmc:
    image: bigtangle-l0:dev
    container_name: e2e-l1-order-mcmc
    networks:
      - e2e-network
    ports:
      - "18087:8087"
    environment:
      APP_MODULE: l1-order-mcmc
      SERVER_PORT: 8087
      SERVER_NET: Test
      REQUESTER: http://l1-order-server:8086
      DB_HOSTNAME: postgres-l1-order
      DB_PORT: 5432
      DB_NAME: ordermatch
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "true"
      SERVICE_MINING_RATE: 500
      SERVICE_MCMC: "true"
      SERVICE_MCMC_RATE: 500
      SERVICE_INITSYNC: "false"
      SERVICE_SYNC: "true"
      SYNCBLOCKS: 1000
      CREATETABLE: "false"
    depends_on:
      l1-order-server:
        condition: service_started
      postgres-l1-order:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    container_name: e2e-app
    networks:
      - e2e-network
    ports:
      - "18081:8081"
    depends_on:
      l0-server:
        condition: service_started

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0
    container_name: e2e-playwright
    networks:
      - e2e-network
    working_dir: /e2e
    volumes:
      - ./playwright.config.ts:/e2e/playwright.config.ts
      - ./playwright:/e2e/playwright
    command: sh -lc "npm install --no-save @playwright/test@1.52.0 && npx playwright test --reporter=list"
    depends_on:
      app:
        condition: service_started
    environment:
      APP_URL: http://app:8081
      E2E_SERVER_URL: http://l0-server:8088/
      E2E_L1_URL: http://l0-server:8088/
      WEB_PORT: 18081
