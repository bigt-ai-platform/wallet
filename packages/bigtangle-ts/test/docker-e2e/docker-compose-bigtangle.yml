networks:
  bigtangle-ts-e2e-network:
    driver: bridge

volumes:
  bigtangle-ts-e2e-postgres:

services:
  postgres:
    image: postgres:16
    container_name: bigtangle-ts-e2e-postgres
    hostname: postgres
    networks:
      - bigtangle-ts-e2e-network
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: info
    volumes:
      - bigtangle-ts-e2e-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d info"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  layer0-server:
    image: ghcr.io/bigt-ai-platform/layer0-server:latest
    container_name: bigtangle-ts-e2e-l0-server
    hostname: layer0-server
    networks:
      - bigtangle-ts-e2e-network
    ports:
      - "18088:8088"
    environment:
      JAVA_OPTS: "-Ddebug -Xmx5028m --add-exports java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8"
      DB_PASSWORD: test1234
      DB_USER: root
      DB_PORT: 5432
      SERVER_PORT: 8088
      DB_NAME: info
      DB_HOSTNAME: postgres
      SERVICE_MCMC_RATE: 1000
      SERVER_MINERADDRESS: 1LLtbSLJJn1D2churfWG55aDYqQQTu4eqH
      SERVERMODE: ""
      SERVICE_MINING_RATE: 10000
      SERVICE_MINING: "true"
      SERVICE_MCMC: "true"
      SERVER_NET: Test
      SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  l1-order-server:
    image: ghcr.io/bigt-ai-platform/l1-order-server:latest
    container_name: bigtangle-ts-e2e-l1-order-server
    hostname: l1-order-server
    networks:
      - bigtangle-ts-e2e-network
    ports:
      - "18089:8088"
    environment:
      JAVA_OPTS: "-Ddebug -Xmx5028m --add-exports java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8"
      DB_PASSWORD: test1234
      DB_USER: root
      DB_PORT: 5432
      SERVER_PORT: 8088
      DB_NAME: info
      DB_HOSTNAME: postgres
      SERVICE_MCMC_RATE: 1000
      SERVER_MINERADDRESS: 1LLtbSLJJn1D2churfWG55aDYqQQTu4eqH
      SERVERMODE: ""
      SERVICE_MINING_RATE: 10000
      SERVICE_MINING: "false"
      SERVICE_MCMC: "true"
      SERVER_NET: Test
      SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


