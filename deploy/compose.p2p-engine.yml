# P2P settlement engine stack (docs/p2p.md) — the service half of the wallet's
# P2P feature. Separate from the static web stack (compose.prod.yml): the engine
# holds the engine signing key and a database, which a client app must not.
#
# OPT-IN Postgres stack. The deployed default is the NO-DATABASE stack
# (deploy/compose.p2p-engine.blob.yml, SETTLEMENT_STORE=blob); use this one only
# for a busy chain / heavy read traffic where the in-memory chain projection is
# not enough. Select it with P2P_COMPOSE=deploy/compose.p2p-engine.yml.
#
#   REGION=europa P2P_PORT=8108 POSTGRES_PASSWORD=… \
#     docker compose -f deploy/compose.p2p-engine.yml up -d
#
# The engine anchors swap events on L1-SOCIAL (SETTLEMENT_L1_URL) and proves
# escrow on L0 (SETTLEMENT_L0_URL). Both are external chain endpoints; this
# stack only adds the engine + its rebuildable Postgres projection.
#
# Secrets to provide (never commit): SETTLEMENT_ENGINE_KEY (ML-DSA seed hex)
# and SETTLEMENT_ADMIN_TOKEN.

name: wallet-p2p-${REGION:-wallet}

services:
  db:
    image: postgres:16-alpine
    container_name: wallet-p2p-${REGION:-wallet}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: p2p
      POSTGRES_USER: p2p
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - p2p-db:/var/lib/postgresql/data
      - ../services/p2p-engine/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2p -d p2p"]
      interval: 10s
      timeout: 3s
      retries: 5

  engine:
    image: ${P2P_IMAGE:-wallet-p2p-engine:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.p2p-engine
    container_name: wallet-p2p-${REGION:-wallet}-engine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgres://p2p:${POSTGRES_PASSWORD}@db:5432/p2p
      # store backend: pg (default) | blob (no Postgres — see SETTLEMENT_BLOB_*)
      # | mem (dev only)
      SETTLEMENT_STORE: ${SETTLEMENT_STORE:-pg}
      # blob mode only: the confidential half (profiles, proofs, escrow
      # signings) in an S3/MinIO bucket (or a directory), AES-256-GCM with
      # SETTLEMENT_BLOB_KEY. SETTLEMENT_STORE=blob needs one target.
      SETTLEMENT_BLOB_URL: ${SETTLEMENT_BLOB_URL:-}
      SETTLEMENT_BLOB_BUCKET: ${SETTLEMENT_BLOB_BUCKET:-}
      SETTLEMENT_BLOB_REGION: ${SETTLEMENT_BLOB_REGION:-}
      SETTLEMENT_BLOB_ACCESS_KEY: ${SETTLEMENT_BLOB_ACCESS_KEY:-}
      SETTLEMENT_BLOB_SECRET_KEY: ${SETTLEMENT_BLOB_SECRET_KEY:-}
      SETTLEMENT_BLOB_PREFIX: ${SETTLEMENT_BLOB_PREFIX:-p2p/}
      SETTLEMENT_BLOB_DIR: ${SETTLEMENT_BLOB_DIR:-}
      SETTLEMENT_BLOB_KEY: ${SETTLEMENT_BLOB_KEY:-}
      PORT: "8108"
      HOST: "0.0.0.0"
      # chains (external). Comma lists; the singular vars stay supported.
      # Discovery gates every endpoint on a healthy getChainNumber probe —
      # no probe pass, no use (fail closed). DNS/registry are opt-in.
      SETTLEMENT_L0_URL: ${SETTLEMENT_L0_URL:-}
      SETTLEMENT_L0_URLS: ${SETTLEMENT_L0_URLS:-}
      SETTLEMENT_L1_URL: ${SETTLEMENT_L1_URL:-}
      SETTLEMENT_L1_SOCIAL_URL: ${SETTLEMENT_L1_SOCIAL_URL:-}
      SETTLEMENT_L1_SOCIAL_URLS: ${SETTLEMENT_L1_SOCIAL_URLS:-}
      # L1-SOCIAL swap-anchor policy (docs/p2p.md §8/§14). The value leg is L0
      # (escrow + fiat); L1-SOCIAL is the evidence log, so the default never
      # blocks a settlement on an unfunded/down anchor node:
      #   best-effort (default) | required (fail closed) | off (L0-only).
      SETTLEMENT_ANCHOR_MODE: ${SETTLEMENT_ANCHOR_MODE:-best-effort}
      # Signed-request throttles (docs/p2p.md §27.4): writes/reads per DID per
      # 60s, and a per-IP cap that bounds sybil floods (trustProxy reads the
      # client IP from Caddy's X-Forwarded-For).
      SETTLEMENT_RATE_LIMIT: ${SETTLEMENT_RATE_LIMIT:-10}
      SETTLEMENT_RATE_LIMIT_READ: ${SETTLEMENT_RATE_LIMIT_READ:-120}
      SETTLEMENT_IP_RATE_LIMIT: ${SETTLEMENT_IP_RATE_LIMIT:-600}
      SETTLEMENT_MAX_OPEN_SWAPS: ${SETTLEMENT_MAX_OPEN_SWAPS:-5}
      SETTLEMENT_ADMIN_IPS: ${SETTLEMENT_ADMIN_IPS:-}
      SETTLEMENT_L0_QUORUM: ${SETTLEMENT_L0_QUORUM:-1}
      SETTLEMENT_DISPUTE_TTL: ${SETTLEMENT_DISPUTE_TTL:-259200}
      SETTLEMENT_DISPUTE_DEFAULT: ${SETTLEMENT_DISPUTE_DEFAULT:-none}
      CORS_ORIGIN_DOMAIN: ${CORS_ORIGIN_DOMAIN:-bigt.ai}
      SETTLEMENT_COSIGN_MAX_PER_HOUR: ${SETTLEMENT_COSIGN_MAX_PER_HOUR:-120}
      SETTLEMENT_COSIGN_ALERT_URL: ${SETTLEMENT_COSIGN_ALERT_URL:-}
      SETTLEMENT_TRUST_PROXY: ${SETTLEMENT_TRUST_PROXY:-1}
      # seller-anchored order intake (docs/p2p.md §11) + the chain-scan
      # projector (§14). SETTLEMENT_WATCH=1 runs the rebuild loop in-process
      # (otherwise: `yarn workspace p2p-engine replay` only). ON by default in
      # prod — the projector is what makes the PG store a chain projection.
      SETTLEMENT_ORDER_TX_VERIFY: ${SETTLEMENT_ORDER_TX_VERIFY:-}
      SETTLEMENT_ORDER_TX_TRIES: ${SETTLEMENT_ORDER_TX_TRIES:-}
      SETTLEMENT_WATCH: ${SETTLEMENT_WATCH:-}
      SETTLEMENT_WATCH_INTERVAL_MS: ${SETTLEMENT_WATCH_INTERVAL_MS:-}
      SETTLEMENT_WATCH_MAX_WALK: ${SETTLEMENT_WATCH_MAX_WALK:-}
      SETTLEMENT_DISCOVERY_MS: ${SETTLEMENT_DISCOVERY_MS:-300000}
      SETTLEMENT_DISCOVERY_DNS: ${SETTLEMENT_DISCOVERY_DNS:-}
      SETTLEMENT_DISCOVERY_TIMEOUT_MS: ${SETTLEMENT_DISCOVERY_TIMEOUT_MS:-5000}
      SETTLEMENT_SEEDS_URLS: ${SETTLEMENT_SEEDS_URLS:-}
      SETTLEMENT_DOH_URL: ${SETTLEMENT_DOH_URL:-}
      SETTLEMENT_DNS_SEEDS_DOMAIN: ${SETTLEMENT_DNS_SEEDS_DOMAIN:-}
      # chain network params for escrow derivation (empty/mainnet = prod).
      # SETTLEMENT_NETWORK=testnet (or SETTLEMENT_TESTNET=1) makes the engine
      # derive the same P2SH address the testnet node reports (e2e infra).
      SETTLEMENT_NETWORK: ${SETTLEMENT_NETWORK:-}
      SETTLEMENT_TESTNET: ${SETTLEMENT_TESTNET:-}
      # engine identity: ML-DSA-87 seed hex (signs records + funds the anchor tx)
      SETTLEMENT_ENGINE_KEY: ${SETTLEMENT_ENGINE_KEY:-}
      # Retained engine keys (comma-separated seeds) — only to settle swaps
      # pinned to a rotated key; rotation is additive (docs/p2p.md §27.3).
      SETTLEMENT_ENGINE_KEYS: ${SETTLEMENT_ENGINE_KEYS:-}
      SETTLEMENT_ENGINE_DID: ${SETTLEMENT_ENGINE_DID:-}
      # escrow key: 2-of-3 P2SH participant (0x05-prefixed PQ pubkey hex)
      SETTLEMENT_ENGINE_PUBKEY: ${SETTLEMENT_ENGINE_PUBKEY:-}
      # separate escrow co-signer seed (falls back to SETTLEMENT_ENGINE_KEY)
      SETTLEMENT_ESCROW_KEY: ${SETTLEMENT_ESCROW_KEY:-}
      # <VAR>_FILE: read the secret from /run/p2p-secrets instead of the environ
      SETTLEMENT_ENGINE_KEY_FILE: ${SETTLEMENT_ENGINE_KEY_FILE:-}
      SETTLEMENT_ESCROW_KEY_FILE: ${SETTLEMENT_ESCROW_KEY_FILE:-}
      SETTLEMENT_ENGINE_KEYS_FILE: ${SETTLEMENT_ENGINE_KEYS_FILE:-}
      SETTLEMENT_ADMIN_TOKEN_FILE: ${SETTLEMENT_ADMIN_TOKEN_FILE:-}
      SETTLEMENT_BLOB_KEY_FILE: ${SETTLEMENT_BLOB_KEY_FILE:-}
      # signed arbiters: only these DIDs can resolve disputes (scripts/p2p-admin.mjs)
      SETTLEMENT_ADMIN_DIDS: ${SETTLEMENT_ADMIN_DIDS:-}
      SETTLEMENT_DISPUTE_2ND_APPROVAL_ABOVE: ${SETTLEMENT_DISPUTE_2ND_APPROVAL_ABOVE:-}
      # admin-gated reads/retries; CORS for the wallet SPA origin
      SETTLEMENT_ADMIN_TOKEN: ${SETTLEMENT_ADMIN_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # CNY collection rails offered (empty → all three: wechat, alipay, bank)
      SETTLEMENT_CNY_RAILS: ${SETTLEMENT_CNY_RAILS:-}
      # escrow settlement closure (docs/p2p.md): pre-signed swaps settle on
      # their own — release at PAYMENT_VERIFIED, refund at EXPIRED. 0 = off.
      SETTLEMENT_ESCROW_HOOK_MS: ${SETTLEMENT_ESCROW_HOOK_MS:-30000}
      SETTLEMENT_ESCROW_POLL_MS: ${SETTLEMENT_ESCROW_POLL_MS:-25000}
    volumes:
      - ${P2P_SECRETS_DIR:-/etc/p2p-engine/secrets}:/run/p2p-secrets:ro
    ports:
      - "127.0.0.1:${P2P_PORT:-8108}:8108"

volumes:
  p2p-db:
