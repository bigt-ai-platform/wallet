# deploy/region.conf — bapp web regional deployment map (sourced by region.sh).
#
# A region = one VM running the bapp web container (deploy/compose.prod.yml)
# behind the shared host Caddy (TLS gateway for the VM). The web bundle talks to
# the EXISTING prod chain straight from the browser — mainnet L1 order-match at
# https://m.bigtangle.org, L0 discovered from the network seeds — so this stack
# deliberately runs NO blockchain containers (see ../blockchain/helper/prod for
# the chain itself).
#
# Regions mirror ../dai (same fleet, same SSH users/keys, cohabiting the same
# VMs on a different host port + vhost):
#   ./deploy/deploy.sh deploy europa
#   DEPLOY_REGIONS="europa asia" ./deploy/deploy.sh
#
# Edit the entries below (VM IP, SSH key/user, domain) before running.

# ─── Regions (analog ../dai) ───
REGIONS=(
  europa
  asia
  usa
)

# Public domain(s) served for this region.
declare -A REGION_DOMAIN
REGION_DOMAIN[europa]="eu.wallet.bigt.ai"
REGION_DOMAIN[asia]="asia.wallet.bigt.ai"
REGION_DOMAIN[usa]="us.wallet.bigt.ai"

# VM that hosts the region (IP or hostname). Same fleet as ../dai.
declare -A REGION_VM
REGION_VM[europa]="85.214.37.95"
REGION_VM[asia]="43.132.208.9"
REGION_VM[usa]="43.162.118.46"

# SSH login for the VM (same as ../dai: europa runs as root, asia/usa as ubuntu).
declare -A REGION_SSH_USER
REGION_SSH_USER[europa]="root"
REGION_SSH_USER[asia]="ubuntu"
REGION_SSH_USER[usa]="ubuntu"

# SSH private key for the VM.
declare -A REGION_SSH_KEY
REGION_SSH_KEY[europa]="${HOME}/.ssh/oraclevpc.key"
REGION_SSH_KEY[asia]="${HOME}/.ssh/oraclevpc.key"
REGION_SSH_KEY[usa]="${HOME}/.ssh/oraclevpc.key"

# ─── Stack knobs ───
# REMOTE_REPO is the working dir on the VM: synced compose file + the loaded
# image tar (no-registry path). Only compose + nginx config live here — the app
# bundle itself comes from the image, nothing is compiled on the VM.
# If left EMPTY, region.sh resolves it per SSH user: root → /srv/bapp,
# ubuntu/other → /home/<user>/bapp. Set it explicitly to override.
REMOTE_REPO="${REMOTE_REPO:-}"

# Host port the web container is published on (Caddy reverse-proxy target).
# NOTE: 8081 is NOT free on this fleet — every VM runs a registry container
# (reg-europa etc.) on 127.0.0.1:8081. 8084 is free on europa/asia/usa and does
# not clash with dai (:3000) or anything else in the 808x range.
WEB_PORT="${WEB_PORT:-8084}"

# ─── App image (single shared image, built + pushed by deploy/tag.sh) ───
# The VMs pull this — no compile happens there. Override via env APP_IMAGE.
# Leave EMPTY for the no-registry path: tag.sh writes
# deploy/.image/bapp-web.latest.tar and region.sh transfers it with docker load.
APP_IMAGE="${APP_IMAGE:-ghcr.io/bigt-ai-platform/bapp-web:latest}"

# ─── Apex (wallet.bigt.ai / www.wallet.bigt.ai) ───
# Served from a single region for now (DNS-only apex → that VM). Only this
# region's Caddy gets the apex vhost. Change to point the apex wherever it
# should be served from (analog ../dai APEX_REGION → bigt.ai).
APEX_REGION="europa"
APEX_DOMAIN="${APEX_DOMAIN:-wallet.bigt.ai}"
