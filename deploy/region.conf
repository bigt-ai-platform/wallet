# deploy/region.conf — bapp web regional deployment map (sourced by region.sh).
#
# A region = one VM running the bapp web container (deploy/compose.prod.yml)
# behind the shared host Caddy (TLS gateway for the VM). The web bundle talks to
# the EXISTING prod chain straight from the browser — mainnet L1 order-match at
# https://m.bigtangle.org, L0 discovered from the network seeds — so this stack
# deliberately runs NO blockchain containers (see ../blockchain/helper/prod for
# the chain itself).
#
# Edit the entries below (VM IP, SSH key/user, domain) before running:
#   ./deploy/region.sh deploy prod

# ─── Regions ───
REGIONS=(
  prod
)

# Public domain(s) served for this region. Edit before deploying.
declare -A REGION_DOMAIN
REGION_DOMAIN[prod]="CHANGE_ME.bigtangle.org"

# VM that hosts the region (IP or hostname). Edit before deploying.
declare -A REGION_VM
REGION_VM[prod]="CHANGE_ME"

# SSH login for the VM.
declare -A REGION_SSH_USER
REGION_SSH_USER[prod]="root"

# SSH private key for the VM.
declare -A REGION_SSH_KEY
REGION_SSH_KEY[prod]="${HOME}/.ssh/CHANGE_ME"

# ─── Stack knobs ───
# REMOTE_REPO is the working dir on the VM: synced compose file + the loaded
# image tar (no-registry path). Only compose + nginx config live here — the app
# bundle itself comes from the image, nothing is compiled on the VM.
REMOTE_REPO="${REMOTE_REPO:-/srv/bapp}"

# Host port the web container is published on (Caddy reverse-proxy target).
WEB_PORT="${WEB_PORT:-8081}"

# ─── App image ───
# Registry image the VM pulls (tag.sh pushes it). Leave EMPTY for the
# no-registry path: tag.sh writes deploy/.image/bapp-web.latest.tar and
# region.sh transfers it with `docker load`.
APP_IMAGE="${APP_IMAGE:-}"
