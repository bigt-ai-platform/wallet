server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed Metro bundles / assets — safe to cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin reverse proxies to the production chain endpoints (blockchain
    # helper/prod/prod.sh + prod-order.sh Caddy TLS entry points). Browsers
    # cannot call the chain servers directly: the network seeds are plain http
    # (mixed content on this https origin) and the https endpoints send no CORS
    # headers. The web build therefore targets these relative bases — see
    # PROD_WEB_L0_BASE / PROD_WEB_L1_BASE in expo-app/sources/constants/app.ts.
    # Keep the upstreams in sync with that file.
    # Per-node same-origin proxies for the Chains page (nginx fallback path;
    # the primary deploy uses the Caddy handle_path blocks in region.sh).
    # Keep the names in sync with MAINNET_NODES in
    # expo-app/sources/lib/chainstatus.ts.
    location /l0/eu1/ {
        proxy_pass https://eu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/eu2/ {
        proxy_pass https://eu2.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu2.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/hk1/ {
        proxy_pass https://hk1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host hk1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu1/ {
        proxy_pass https://ordereu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu2/ {
        proxy_pass https://ordereu2.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu2.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/orderhk1/ {
        proxy_pass https://orderhk1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host orderhk1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/ {
        proxy_pass https://eu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # L1-prediction chain: its own node, same-origin for the same reason as
    # /l1/ (the nodes send no CORS). Keep in sync with PROD_WEB_PREDICTION_BASE
    # in expo-app/sources/constants/app.ts.
    location /l1p/ {
        proxy_pass https://predicteu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host predicteu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ {
        proxy_pass https://ordereu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # P2P settlement engine (services/p2p-engine) — same-origin because the
    # bundle bakes EXPO_PUBLIC_P2P_ENGINE_URL=/p2p (deploy/tag.sh). The SPA
    # route is exactly /p2p; only /p2p/<api> is proxied to the engine.
    # Keep the upstream port in sync with region.sh (P2P_PORT).
    # Without this exact match try_files' $uri/ turns /p2p into a 301 to
    # /p2p/, which the engine then answers with a 404 (route GET:/ not found).
    location = /p2p {
        try_files /index.html =404;
    }
    location /p2p/ {
        proxy_pass http://127.0.0.1:8108/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback (expo-router static export). The entry document must be
    # revalidated so a new deploy is picked up without a manual cache purge;
    # content-hashed bundles under /_expo keep their immutable cache.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
