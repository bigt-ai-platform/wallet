server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed Metro bundles / assets — safe to cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin reverse proxies to the production chain endpoints (blockchain
    # helper/prod/prod.sh + prod-order.sh Caddy TLS entry points). Browsers
    # cannot call the chain servers directly: the network seeds are plain http
    # (mixed content on this https origin) and the https endpoints send no CORS
    # headers. The web build therefore targets these relative bases — see
    # PROD_WEB_L0_BASE / PROD_WEB_L1_BASE in expo-app/sources/constants/app.ts.
    # Keep the upstreams in sync with that file.
    # Per-node same-origin proxies for the Chains page (nginx fallback path;
    # the primary deploy uses the Caddy handle_path blocks in region.sh).
    location /l0/eu1/ {
        proxy_pass https://eu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/eu2/ {
        proxy_pass https://eu2.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu2.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/eu3/ {
        proxy_pass https://eu3.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu3.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/eu4/ {
        proxy_pass https://eu4.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu4.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/eu5/ {
        proxy_pass https://eu5.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu5.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu1/ {
        proxy_pass https://ordereu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu2/ {
        proxy_pass https://ordereu2.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu2.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu3/ {
        proxy_pass https://ordereu3.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu3.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu4/ {
        proxy_pass https://ordereu4.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu4.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ordereu5/ {
        proxy_pass https://ordereu5.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu5.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l0/ {
        proxy_pass https://eu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ {
        proxy_pass https://ordereu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # P2P settlement engine (services/p2p-engine) — same-origin because the
    # bundle bakes EXPO_PUBLIC_P2P_ENGINE_URL=/p2p (deploy/tag.sh). The SPA
    # route /p2p falls through to index.html; only /p2p/<api> is proxied.
    # Keep the upstream port in sync with region.sh (P2P_PORT).
    location /p2p/ {
        proxy_pass http://127.0.0.1:8108/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback (expo-router static export).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
