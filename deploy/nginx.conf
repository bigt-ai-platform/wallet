server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content-hashed Metro bundles / assets — safe to cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin reverse proxies to the production chain endpoints (blockchain
    # helper/prod/prod.sh + prod-order.sh Caddy TLS entry points). Browsers
    # cannot call the chain servers directly: the network seeds are plain http
    # (mixed content on this https origin) and the https endpoints send no CORS
    # headers. The web build therefore targets these relative bases — see
    # PROD_WEB_L0_BASE / PROD_WEB_L1_BASE in expo-app/sources/constants/app.ts.
    # Keep the upstreams in sync with that file.
    location /l0/ {
        proxy_pass https://eu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /l1/ {
        proxy_pass https://ordereu1.bigtangle.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host ordereu1.bigtangle.org;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback (expo-router static export).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
