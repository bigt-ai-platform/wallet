name: Preview Build (PR)

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # Job 1: Build preview for web
  preview-web:
    name: Preview Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export web build
        
        run: npx expo export:web
        env:
          APP_ENV: preview

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-pr-${{ github.event.pull_request.number }}
          path: expo-app/web-build/
          retention-days: 7

      - name: Comment on PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const repoUrl = context.payload.repository.html_url;

            const comment = `## 🌐 Web Preview Available

            A preview build has been created for this PR.

            **Download the build:**
            [Web Build Artifact](${repoUrl}/actions/runs/${runId})

            **To test locally:**
            1. Download the artifact
            2. Extract the files
            3. Serve with a static server: \`npx serve web-build\`

            ---
            *Preview build created at ${new Date().toUTCString()}*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

  # Job 2: Build preview for mobile (EAS Update)
  preview-mobile:
    name: Preview Mobile Build (EAS Update)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install EAS CLI
        run: yarn install -g eas-cli

      - name: Publish EAS Update
        
        run: |
          eas update --branch pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get update details
        id: update
        
        run: |
          UPDATE_OUTPUT=$(eas update:view --branch pr-${{ github.event.pull_request.number }} --json)
          echo "update_id=$(echo $UPDATE_OUTPUT | jq -r '.id')" >> $GITHUB_OUTPUT
          echo "update_url=$(echo $UPDATE_OUTPUT | jq -r '.url')" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment on PR with mobile preview
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            const comment = `## 📱 Mobile Preview Available (EAS Update)

            An EAS Update has been published for this PR.

            **Branch:** \`pr-${prNumber}\`

            **To test:**
            1. Install the development build on your device
            2. Open the app and pull down to reload
            3. The update will be applied automatically

            **Or scan QR code:**
            Run \`eas update:view --branch pr-${prNumber}\` to get QR code

            ---
            *Update published at ${new Date().toUTCString()}*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

  # Job 3: Run quick tests
  preview-tests:
    name: Preview Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run type check
        working-directory: ./expo-app
        run: yarn typecheck

      - name: Run unit tests
        working-directory: ./expo-app
        run: yarn test -- --run
        continue-on-error: true

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const typecheckStatus = '${{ steps.typecheck.outcome }}' === 'success' ? '✅' : '❌';
            const testStatus = '${{ steps.tests.outcome }}' === 'success' ? '✅' : '❌';

            const comment = `## 🧪 Preview Tests

            | Check | Status |
            |-------|--------|
            | Type Check | ${typecheckStatus} |
            | Unit Tests | ${testStatus} |

            View full results in the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });



