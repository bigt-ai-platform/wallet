name: Publish App (Web, Android, iOS)

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - android
          - ios
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

env:
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # Job 1: Build and publish web
  publish-web:
    name: Publish Web
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout bigtangle-ts
        uses: actions/checkout@v4
        with:
          repository: bigtangle/bigtangle-ts
          path: bigtangle-ts


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install bigtangle-ts dependencies
        working-directory: ./bigtangle-ts
        run: npm install

      - name: Build bigtangle-ts
        working-directory: ./bigtangle-ts
        run: npm run build

      - name: Re-install dependencies to update bigtangle-ts symlink
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: ./expo-app
        run: yarn typecheck
        continue-on-error: true

      - name: Export web build
        working-directory: ./expo-app
        run: npx expo export --platform web
        env:
          APP_ENV: production

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: expo-app/web-build/
          retention-days: 30

      - name: Deploy to GitHub Pages (optional)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./expo-app/web-build
          cname: your-domain.com # Optional: Add your custom domain

  # Job 2: Build and publish Android
  publish-android:
    name: Publish Android
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout bigtangle-ts
        uses: actions/checkout@v4
        with:
          repository: bigtangle/bigtangle-ts
          path: bigtangle-ts


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install bigtangle-ts dependencies
        working-directory: ./bigtangle-ts
        run: npm install

      - name: Build bigtangle-ts
        working-directory: ./bigtangle-ts
        run: npm run build

      - name: Re-install dependencies to update bigtangle-ts symlink
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: ./expo-app
        run: yarn typecheck
        continue-on-error: true

      - name: Setup EAS CLI
        run: yarn global add eas-cli

      - name: Build Android APK (Development)
        if: github.event.inputs.profile == 'preview' || github.ref != 'refs/heads/main'
        
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB (Production)
        if: github.event.inputs.profile == 'production' || github.ref == 'refs/heads/main'
        
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play (Production only)
        if: github.ref == 'refs/heads/main' && (github.event.inputs.profile == 'production' || github.event_name == 'push')
        
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Job 3: Build and publish iOS
  publish-ios:
    name: Publish iOS
    runs-on: macos-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout bigtangle-ts
        uses: actions/checkout@v4
        with:
          repository: bigtangle/bigtangle-ts
          path: bigtangle-ts


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install bigtangle-ts dependencies
        working-directory: ./bigtangle-ts
        run: npm install

      - name: Build bigtangle-ts
        working-directory: ./bigtangle-ts
        run: npm run build

      - name: Re-install dependencies to update bigtangle-ts symlink
        run: yarn install --frozen-lockfile

      - name: Type check
        working-directory: ./expo-app
        run: yarn typecheck
        continue-on-error: true

      - name: Setup EAS CLI
        run: yarn global add eas-cli

      - name: Build iOS (Development)
        if: github.event.inputs.profile == 'preview' || github.ref != 'refs/heads/main'
        
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS (Production)
        if: github.event.inputs.profile == 'production' || github.ref == 'refs/heads/main'
        
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store (Production only)
        if: github.ref == 'refs/heads/main' && (github.event.inputs.profile == 'production' || github.event_name == 'push')
        
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Job 4: Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-web, publish-android, publish-ios]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout bigtangle-ts
        uses: actions/checkout@v4
        with:
          repository: bigtangle/bigtangle-ts
          path: bigtangle-ts


      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./release/web

      - name: Create release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          cat > RELEASE_NOTES.md << EOF
          # Release $VERSION

          ## What's New

          - Web build available for deployment
          - Android build submitted to Google Play
          - iOS build submitted to App Store

          ## Downloads

          - Web: See artifacts below
          - Android: Available on Google Play Store
          - iOS: Available on App Store

          ## Installation

          ### Web
          Deploy the web-build artifact to your hosting service.

          ### Mobile
          Download from respective app stores or install development builds from EAS.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.release_notes.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ./release/web/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Notify on completion
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [publish-web, publish-android, publish-ios]
    if: always()

    steps:
      - name: Check job status
        id: check
        run: |
          if [ "${{ needs.publish-web.result }}" == "success" ] && \
             [ "${{ needs.publish-android.result }}" == "success" ] && \
             [ "${{ needs.publish-ios.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All platforms published successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Some platforms failed to publish" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Web**: ${{ needs.publish-web.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Android**: ${{ needs.publish-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS**: ${{ needs.publish-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.check.outputs.message }}" >> $GITHUB_STEP_SUMMARY



